<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      padding: 10px;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-weight: 500;
      background-color: #fff;
      margin: 0;
      border-radius: 14px;
      overflow: hidden;
    }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 0;
      color: #606060;
      font-weight: 450;
    }
    .popup-logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    h1 a {
      color: inherit;
      text-decoration: none;
    }
    h1 a:hover {
      text-decoration: underline;
    }
    #chapters {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .chapter-item {
      background-color: white;
      padding: 6px;
      border: 1px solid #d6d6d6;
      border-left: 4px solid #009dff;
      margin-bottom: 4px;
      border-radius: 8px;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    .chapter-item.recent-chapter {
      border-left-color: #d32f2f;
    }
    .chapter-item:focus {
      outline: 2px solid #009dff;
    }
    .chapter-title {
      flex: 1;
      min-width: 0;
      color: #0f243f;
      font-size: 14px;
      font-weight: 500;
      margin: 0;
    }
    .chapter-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .latest-label {
      flex: 0 0 auto;
      padding: 3px 6px;
      border-radius: 999px;
      background-color: #ffebee;
      color: #c62828;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }
    .chapter-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 11px;
    }
    .chapter-release-age {
      color: #777;
      font-weight: 400;
    }
    .chapter-break {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 999px;
      background-color: #fff1bd;
      color: #805c00;
      font-size: 10px;
      font-weight: 500;
    }
    .chapter-break-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #d99a00;
    }
    .chapter-item:hover {
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
      transform: translateY(-1px);
    }
    #loading {
      text-align: center;
      color: #666;
      padding: 16px;
    }
    #error {
      background-color: #ffebee;
      color: #d32f2f;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: none;
    }
    .error-guidance {
      margin: 6px 0 0;
    }
    .error-link {
      position: relative;
      display: block;
      box-sizing: border-box;
      width: fit-content;
      min-width: 150px;
      margin: 8px auto 0;
      padding: 8px 36px 8px 12px;
      border-radius: 999px;
      background-color: #123b68;
      color: white;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
    }
    .error-link:hover {
      background-color: #1d568d;
    }
    .error-link svg {
      position: absolute;
      right: 12px;
      top: 50%;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
      transform: translateY(-50%);
    }
    #websiteBtn {
      width: 100%;
      margin-top: 8px;
      padding: 8px 16px;
      background-color: #123b68;
      color: white;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s, background-color 0.2s;
    }
    #websiteBtn:hover {
      background-color: #1d568d;
      transform: translateY(-1px);
    }
    #websiteBtn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }
    /*
    #clearCacheBtn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background-color: #666;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: normal;
    }
    #clearCacheBtn:hover {
      background-color: #888;
    }
    */
  </style>
</head>
<body>
  <header class="popup-header">
    <h1><a id="mainTitleLink" href="https://www.reddit.com/r/OnePiece/" target="_blank" rel="noopener noreferrer">Latest One Piece Chapters</a></h1>
    <img class="popup-logo" src="icons/icon-48.png" alt="One Piece Chapters Checker logo">
  </header>
  <div id="error"></div>
  <div id="loading">Loading chapters...</div>
  <ul id="chapters" style="display: none;"></ul>
  <button id="websiteBtn">
    Visit TCB Scans
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M14 4h6v6"></path>
      <path d="M20 4 11 13"></path>
      <path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"></path>
    </svg>
  </button>
  <!-- <button id="clearCacheBtn">Clear Cache & Reload</button> -->
  <script src="popup.js"></script>
</body>
</html>
